
<div class="login-page">

  <div class="login-decoration decoration-one"></div>
  <div class="login-decoration decoration-two"></div>

  <div class="login-card">

    <div class="login-brand">
      <div class="brand-logo">SGA</div>
      <h1>Gestão Acadêmica</h1>
      <p>SISTEMA DE GESTÃO EDUCACIONAL</p>
    </div>

    <div class="login-heading">
      <h2>Bem-vindo!</h2>
      <p>Entre com seus dados para acessar o sistema.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="entrar()">

      <!-- E-MAIL -->
      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="username"
          required
        >
      </div>

      <!-- SENHA -->
      <div class="form-group">
        <label for="senha">Senha</label>

        <div class="password-field">

          <input
            id="senha"
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">

            @if (mostrarSenha) {
              <!-- OLHO ABERTO -->
              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <!-- OLHO FECHADO -->
              <svg viewBox="0 0 24 24">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
              </svg>
            }

          </button>

        </div>
      </div>

      <!-- ACEITE DOS TERMOS E LGPD -->
      <div class="terms-check">

        <input
          type="checkbox"
          id="aceiteLogin"
          name="aceiteLogin"
          [(ngModel)]="aceiteTermos"
          required
        >

        <label for="aceiteLogin">
          Li e aceito os <strong>Termos de Uso</strong> e declaro estar
          ciente do <strong>Aviso de Privacidade (LGPD)</strong>.
        </label>

      </div>

      <!-- MENSAGEM DE ERRO -->
      @if (mensagemErro) {
        <div class="error-message">
          {{ mensagemErro }}
        </div>
      }

      <!-- BOTÃO DE ACESSO -->
      <button
        type="submit"
        class="login-button"
        [disabled]="carregando || !loginForm.valid || !aceiteTermos">

        {{ carregando ? 'Entrando...' : 'Acessar sistema' }}

      </button>

    </form>

    <!-- CADASTRO -->
    <div class="register-link">
      Ainda não possui uma conta?
      <a routerLink="/cadastro">Criar conta</a>
    </div>

    <div class="login-footer">
      Sistema de Gestão Acadêmica • 2026
    </div>

  </div>

</div>
