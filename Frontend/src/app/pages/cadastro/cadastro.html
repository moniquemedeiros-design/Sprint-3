
<div class="cadastro-page">

  <div class="cadastro-decoration decoration-one"></div>
  <div class="cadastro-decoration decoration-two"></div>

  <div class="cadastro-card">

    <div class="cadastro-brand">
      <div class="brand-logo">SGA</div>
      <h1>Gestão Acadêmica</h1>
      <p>SISTEMA DE GESTÃO EDUCACIONAL</p>
    </div>

    <div class="cadastro-heading">
      <h2>Criar uma conta</h2>
      <p>Preencha os dados para acessar o sistema.</p>
    </div>

    <form #cadastroForm="ngForm" (ngSubmit)="cadastrar()">

      <!-- NOME -->
      <div class="form-group">
        <label for="nome">Nome completo</label>

        <input
          id="nome"
          type="text"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Digite seu nome completo"
          autocomplete="name"
          required
        >
      </div>

      <!-- E-MAIL -->
      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >
      </div>

      <!-- SENHA -->
      <div class="form-group">
        <label for="senha">Senha</label>

        <div class="password-field">

          <input
            id="senha"
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">

            @if (mostrarSenha) {
              <!-- OLHO ABERTO -->
              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <!-- OLHO FECHADO -->
              <svg viewBox="0 0 24 24">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
              </svg>
            }

          </button>

        </div>
      </div>

      <!-- CONFIRMAR SENHA -->
      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>

        <div class="password-field">

          <input
            id="confirmarSenha"
            [type]="mostrarConfirmacao ? 'text' : 'password'"
            name="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            (click)="mostrarConfirmacao = !mostrarConfirmacao"
            [attr.aria-label]="mostrarConfirmacao ? 'Ocultar senha' : 'Mostrar senha'">

            @if (mostrarConfirmacao) {
              <!-- OLHO ABERTO -->
              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <!-- OLHO FECHADO -->
              <svg viewBox="0 0 24 24">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
              </svg>
            }

          </button>

        </div>
      </div>

      <!-- ACEITE DOS TERMOS E LGPD -->
      <div class="terms-check">

        <input
          type="checkbox"
          id="aceiteCadastro"
          name="aceiteCadastro"
          [(ngModel)]="aceiteTermos"
          required
        >

        <label for="aceiteCadastro">
          Li e aceito os <strong>Termos de Uso</strong> e declaro estar
          ciente do <strong>Aviso de Privacidade (LGPD)</strong>.
        </label>

      </div>

      <!-- MENSAGENS -->
      @if (mensagemErro) {
        <div class="error-message">
          {{ mensagemErro }}
        </div>
      }

      @if (mensagemSucesso) {
        <div class="success-message">
          {{ mensagemSucesso }}
        </div>
      }

      <!-- BOTÃO CADASTRAR -->
      <button
        type="submit"
        class="cadastro-button"
        [disabled]="
          carregando ||
          !cadastroForm.valid ||
          !aceiteTermos ||
          senha !== confirmarSenha
        ">

        {{ carregando ? 'Criando conta...' : 'Criar conta' }}

      </button>

    </form>

    <!-- VOLTAR AO LOGIN -->
    <div class="login-link">
      Já possui uma conta?
      <a routerLink="/login">Voltar para o login</a>
    </div>

    <div class="cadastro-footer">
      Sistema de Gestão Acadêmica • 2026
    </div>

  </div>

</div>
